<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7c4bf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>家計簿</title>
<style>
:root{--bg:#f7f3ef;--card:#fffdfb;--ink:#625b58;--muted:#9b918d;--pink:#d7b9b5;--sage:#bdcbbb;--lav:#cbc1d1;--line:#eee6e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:560px;margin:auto;padding:18px 15px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}h1{font-size:23px;margin:0;font-weight:850}.sub,.small,.label{font-size:11px;color:var(--muted)}
.month{border:1px solid var(--line);border-radius:16px;padding:9px;background:white;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:17px;margin-bottom:13px;box-shadow:0 8px 24px #64554d14}
.tabs{display:flex;gap:7px;overflow-x:auto;background:#eee9e5;padding:5px;border-radius:18px;margin-bottom:13px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{border:0;background:transparent;border-radius:14px;padding:10px 14px;color:var(--muted);font-weight:800;white-space:nowrap}.tabs button.active{background:white;color:var(--ink)}
.total{font-size:31px;font-weight:850;margin:3px 0 13px}.peopleCards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.personCard{padding:12px;border-radius:19px;background:#f4e9e6}.personCard:nth-child(even){background:#e9f0eb}.personCard strong{display:block;font-size:18px;margin-top:4px}.personCard b{font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action,.tool{border:0;border-radius:17px;padding:13px;background:#eadbd8;color:var(--ink);font-weight:800;text-align:center}.action:nth-child(2){background:#dce8df}input[type=file]{display:none}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool{padding:9px 10px;background:#eee7e2;font-size:11px}
.notice{font-size:11px;line-height:1.7;color:#817773;background:#f2ece7;border-radius:15px;padding:11px;margin-top:11px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.merchant{font-weight:750;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.amount{font-weight:850;white-space:nowrap}.tag{display:inline-block;border-radius:999px;padding:4px 7px;font-size:9px;background:#eee5df}.mini{border:0;border-radius:10px;background:#f1ebe7;color:var(--ink);padding:6px 8px;font-size:10px}
.filter{display:flex;gap:7px;margin-top:12px}.filter select,dialog select,dialog input{width:100%;padding:11px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);margin:5px 0 11px}
.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:12px;line-height:1.8}
dialog{width:min(93%,500px);border:0;border-radius:26px;padding:20px;background:var(--card);color:var(--ink)}dialog::backdrop{background:#51494355}.close{float:right;border:0;background:#eee7e2;border-radius:50%;width:32px;height:32px}.primary{width:100%;border:0;border-radius:16px;padding:13px;background:#d7c2bd;color:#574e4b;font-weight:850}.danger{background:#eed6d2}.line{display:flex;gap:7px;align-items:center}.line input{margin:0;flex:1}.line button{margin-bottom:6px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="app">
<header><div><h1 id="appTitle">家計簿 🫧</h1><div class="sub">みんなのお金を、やさしく整理</div></div><input id="month" class="month" type="month"></header>

<div id="tabs" class="tabs"></div>

<section class="card"><div class="label">今月の支出</div><div id="total" class="total">¥0</div><div id="peopleCards" class="peopleCards"></div></section>

<section class="card">
<div class="actions"><label class="action">📥 PayPay CSV<input id="csv" type="file" accept=".csv,text/csv"></label><button class="action" id="add">＋ 明細を追加</button></div>
<div class="toolbar">
<button class="tool" id="peopleBtn">👥 メンバー編集</button>
<button class="tool" id="catsBtn">🏷️ ジャンル編集</button>
<button class="tool" id="settingsBtn">⚙️ 名前設定</button>
<button class="tool" id="export">📤 バックアップ</button>
<label class="tool">📂 復元<input id="restore" type="file" accept=".json"></label>
</div>
<div class="notice">買ったもの・金額・人・ジャンルはあとから編集できます。メンバーも好きな人数に増やせます。</div>
</section>

<section class="card"><b>ジャンル別</b><div id="categories"></div></section>

<section class="card"><div class="sectionTitle"><b>明細</b><span id="count" class="small">0件</span></div>
<div class="filter"><select id="catFilter"><option value="">全ジャンル</option></select><select id="personFilter"><option value="">全員</option></select></div>
<div id="transactions"></div></section>
</div>

<dialog id="editDlg"><button class="close" onclick="editDlg.close()">×</button><h2 id="editTitle">明細を追加</h2>
<input id="eMerchant" placeholder="買ったもの / 支払先"><input id="eAmount" type="number" inputmode="numeric" placeholder="金額"><input id="eDate" type="date">
<select id="ePerson"></select><select id="eCat"></select><input id="eMemo" placeholder="メモ（任意）">
<button class="primary" id="saveTx">保存する</button><button class="primary danger" id="deleteTx" style="margin-top:8px;display:none">削除する</button></dialog>

<dialog id="catDlg"><button class="close" onclick="catDlg.close()">×</button><h2>ジャンル編集</h2><div id="catList"></div><input id="newCat" placeholder="新しいジャンル名"><button class="primary" id="addCat">＋ ジャンル追加</button></dialog>

<dialog id="peopleDlg"><button class="close" onclick="peopleDlg.close()">×</button><h2>メンバー編集</h2><div id="peopleList"></div><input id="newPerson" placeholder="名前や絵文字（例：👶🏻 そあ）"><button class="primary" id="addPerson">＋ メンバー追加</button></dialog>

<dialog id="settingsDlg"><button class="close" onclick="settingsDlg.close()">×</button><h2>家計簿の名前</h2><input id="bookName" placeholder="家計簿"><button class="primary" id="saveSettings">保存する</button></dialog>

<script>
const DEFAULT_CATS=["食費","日用品","ベビー","車・ガソリン","通信費","美容・衣服","住宅","医療","趣味・娯楽","その他"];
const DEFAULT_PEOPLE=[{id:"p1",name:"👩🏻"},{id:"p2",name:"👨🏻"}];
const RULES={"西松屋":"ベビー","アカチャンホンポ":"ベビー","SHEIN":"美容・衣服","ベルフ":"食費","マイヤ":"食費","マクドナルド":"食費","サーティワン":"食費","セリア":"日用品","ダイソー":"日用品","キャンドゥ":"日用品","ワッツ":"日用品","薬王堂":"日用品","ツルハ":"日用品","ウエルシア":"日用品","JA-SS":"車・ガソリン","タイムズ":"車・ガソリン","ソフトバンク":"通信費","ユニクロ":"美容・衣服","GU":"美容・衣服","ジーユー":"美容・衣服","しまむら":"美容・衣服","tutuanna":"美容・衣服","POP MART":"趣味・娯楽","ホビーゾーン":"趣味・娯楽","ちいかわ":"趣味・娯楽"};

let tx=JSON.parse(localStorage.getItem("kb_tx")||"[]");
let cats=JSON.parse(localStorage.getItem("kb_cats")||"null")||DEFAULT_CATS.slice();
let people=JSON.parse(localStorage.getItem("kb_people")||"null")||DEFAULT_PEOPLE.slice();
let learned=JSON.parse(localStorage.getItem("kb_rules")||"{}");
let settings=JSON.parse(localStorage.getItem("kb_settings")||"null")||{name:"家計簿"};
let viewPerson="all",editingId=null;
const $=id=>document.getElementById(id); month.value=new Date().toISOString().slice(0,7);

function persist(){
 localStorage.setItem("kb_tx",JSON.stringify(tx));
 localStorage.setItem("kb_cats",JSON.stringify(cats));
 localStorage.setItem("kb_people",JSON.stringify(people));
 localStorage.setItem("kb_rules",JSON.stringify(learned));
 localStorage.setItem("kb_settings",JSON.stringify(settings));
}
function yen(n){return"¥"+Math.round(n).toLocaleString("ja-JP")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function personName(id){return people.find(p=>p.id===id)?.name||"不明"}
function classify(s){if(learned[s])return learned[s];for(const k in RULES)if((s||"").includes(k)&&cats.includes(RULES[k]))return RULES[k];return cats.includes("その他")?"その他":cats[0]}

function fillSelects(){
 eCat.innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join("");
 catFilter.innerHTML='<option value="">全ジャンル</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
 ePerson.innerHTML=people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
 personFilter.innerHTML='<option value="">全員</option>'+people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
}

function renderTabs(){
 tabs.innerHTML=`<button class="${viewPerson==="all"?"active":""}" onclick="setView('all')">みんな</button>`+
 people.map(p=>`<button class="${viewPerson===p.id?"active":""}" onclick="setView('${p.id}')">${esc(p.name)}</button>`).join("");
}
window.setView=id=>{viewPerson=id;render()}

function render(){
 fillSelects();renderTabs();
 appTitle.textContent=(settings.name||"家計簿")+" 🫧";
 let mon=month.value,cf=catFilter.value,pf=personFilter.value;
 let arr=tx.filter(t=>t.date?.slice(0,7)===mon&&(viewPerson==="all"||t.person===viewPerson)&&(!cf||t.cat===cf)&&(!pf||t.person===pf));
 let all=tx.filter(t=>t.date?.slice(0,7)===mon);
 total.textContent=yen(arr.reduce((a,b)=>a+b.amount,0));
 peopleCards.innerHTML=people.map(p=>`<div class="personCard"><b>${esc(p.name)}</b><strong>${yen(all.filter(t=>t.person===p.id).reduce((a,b)=>a+b.amount,0))}</strong></div>`).join("");
 count.textContent=arr.length+"件";
 let sums={};arr.forEach(t=>sums[t.cat]=(sums[t.cat]||0)+t.amount);
 categories.innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${yen(v)}</b></div>`).join("")||'<div class="empty">ジャンルデータなし</div>';
 transactions.innerHTML=arr.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(t=>`<div class="row" onclick="openEdit('${t.id}')"><div style="flex:1;min-width:0"><div class="merchant">${esc(t.merchant)} <span class="tag">${esc(personName(t.person))}</span></div><div class="meta">${t.date||""} ・ ${esc(t.cat)}${t.memo?" ・ "+esc(t.memo):""}</div></div><div class="amount">${yen(t.amount)} ›</div></div>`).join("")||'<div class="empty">まだ明細がありません。<br>「明細を追加」かPayPay CSVからどうぞ🌷</div>';
}

function openNew(){
 editingId=null;editTitle.textContent="明細を追加";eMerchant.value="";eAmount.value="";eDate.value=new Date().toISOString().slice(0,10);fillSelects();ePerson.value=people[0]?.id||"";eCat.value=cats[0]||"";eMemo.value="";deleteTx.style.display="none";editDlg.showModal();
}
window.openEdit=id=>{let t=tx.find(x=>x.id===id);if(!t)return;editingId=id;editTitle.textContent="明細を編集";eMerchant.value=t.merchant;eAmount.value=t.amount;eDate.value=t.date;fillSelects();ePerson.value=t.person;eCat.value=t.cat;eMemo.value=t.memo||"";deleteTx.style.display="block";editDlg.showModal()}
add.onclick=openNew;
saveTx.onclick=()=>{let merchant=eMerchant.value.trim(),amount=Math.abs(Number(eAmount.value));if(!merchant||!amount)return alert("買ったものと金額を入れてね");let obj={merchant,amount,date:eDate.value||new Date().toISOString().slice(0,10),person:ePerson.value,cat:eCat.value,memo:eMemo.value.trim()};if(editingId){let i=tx.findIndex(x=>x.id===editingId);tx[i]={...tx[i],...obj};learned[merchant]=obj.cat}else tx.push({id:crypto.randomUUID(),...obj});persist();editDlg.close();render()}
deleteTx.onclick=()=>{if(editingId&&confirm("この明細を削除する？")){tx=tx.filter(x=>x.id!==editingId);persist();editDlg.close();render()}}
month.onchange=render;catFilter.onchange=render;personFilter.onchange=render;

function showCats(){catList.innerHTML=cats.map((c,i)=>`<div class="line"><input value="${esc(c)}" onchange="renameCat(${i},this.value)"><button class="mini" onclick="removeCat(${i})">削除</button></div>`).join("");catDlg.showModal()}
catsBtn.onclick=showCats;
window.renameCat=(i,n)=>{n=n.trim();if(!n||cats.includes(n))return;let old=cats[i];cats[i]=n;tx.forEach(t=>{if(t.cat===old)t.cat=n});Object.keys(learned).forEach(k=>{if(learned[k]===old)learned[k]=n});persist();render();showCats()}
window.removeCat=i=>{if(cats.length<=1)return alert("ジャンルは1つ以上必要です");let old=cats[i],fallback=cats.find((_,j)=>j!==i);if(!confirm(`「${old}」を削除して、その明細を「${fallback}」に変更する？`))return;cats.splice(i,1);tx.forEach(t=>{if(t.cat===old)t.cat=fallback});persist();render();showCats()}
addCat.onclick=()=>{let n=newCat.value.trim();if(!n)return;if(cats.includes(n))return alert("同じジャンルがあります");cats.push(n);newCat.value="";persist();render();showCats()}

function showPeople(){peopleList.innerHTML=people.map((p,i)=>`<div class="line"><input value="${esc(p.name)}" onchange="renamePerson(${i},this.value)"><button class="mini" onclick="removePerson(${i})">削除</button></div>`).join("");peopleDlg.showModal()}
peopleBtn.onclick=showPeople;
window.renamePerson=(i,n)=>{n=n.trim();if(!n)return;people[i].name=n;persist();render();showPeople()}
window.removePerson=i=>{if(people.length<=1)return alert("メンバーは1人以上必要です");let p=people[i];let fallback=people.find((_,j)=>j!==i);if(!confirm(`「${p.name}」を削除して、その明細を「${fallback.name}」へ移す？`))return;tx.forEach(t=>{if(t.person===p.id)t.person=fallback.id});if(viewPerson===p.id)viewPerson="all";people.splice(i,1);persist();render();showPeople()}
addPerson.onclick=()=>{let n=newPerson.value.trim();if(!n)return;people.push({id:"p"+Date.now(),name:n});newPerson.value="";persist();render();showPeople()}

settingsBtn.onclick=()=>{bookName.value=settings.name||"家計簿";settingsDlg.showModal()}
saveSettings.onclick=()=>{settings.name=bookName.value.trim()||"家計簿";persist();settingsDlg.close();render()}

csv.onchange=async e=>{
 let f=e.target.files[0];if(!f)return;
 if(!people.length)return alert("先にメンバーを追加してね");
 let rows=(await f.text()).replace(/^\uFEFF/,"").split(/\r?\n/).filter(Boolean).map(parseCSV),h=rows[0].map(x=>x.trim()),idx=n=>h.findIndex(x=>x.includes(n)),di=idx("取引日"),oi=idx("出金金額"),si=idx("取引内容"),mi=idx("取引先"),meth=idx("取引方法"),ni=idx("取引番号"),existing=new Set(tx.map(t=>t.txno).filter(Boolean)),n=0;
 let choice=prompt("このCSVは誰のPayPay？\\n番号を入力してね\\n"+people.map((p,i)=>`${i+1}: ${p.name}`).join("\\n"),"1");
 let owner=people[Math.max(0,Math.min(people.length-1,(Number(choice)||1)-1))].id;
 for(let r of rows.slice(1)){let desc=(r[si]||"").trim(),merchant=(r[mi]||"").trim(),txno=(r[ni]||"").trim();if(!txno||existing.has(txno)||desc!=="支払い")continue;let amount=Math.abs(Number((r[oi]||"").replace(/[^\d.-]/g,"")));if(!amount)continue;let date=(r[di]||"").slice(0,10).replaceAll("/","-");tx.push({id:crypto.randomUUID(),txno,date,merchant:merchant||"不明",amount,person:owner,cat:classify(merchant),method:(r[meth]||"PayPay").trim(),memo:""});existing.add(txno);n++}
 persist();e.target.value="";render();alert(n+"件読み込んだよ！");
}
function parseCSV(line){let o=[],c="",q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x=='"'){if(q&&line[i+1]=='"'){c+='"';i++}else q=!q}else if(x==","&&!q){o.push(c);c=""}else c+=x}o.push(c);return o}

export.onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({tx,cats,people,learned,settings},null,2)],{type:"application/json"}));a.download="家計簿バックアップ.json";a.click()}
restore.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());tx=d.tx||[];cats=d.cats||DEFAULT_CATS.slice();people=d.people||DEFAULT_PEOPLE.slice();learned=d.learned||{};settings=d.settings||{name:"家計簿"};persist();render();alert("復元したよ🫶")}catch{alert("復元できませんでした")}}

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
render();
</script>
</body></html>
