<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7c4bf">
<title>家計簿</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">

<style>
:root{--bg:#f7f3ef;--card:#fffdfb;--ink:#5f5855;--muted:#9b918d;--line:#eee6e1;--pink:#eadbd8;--sage:#dce8df;--lav:#e5deea;--danger:#efd8d4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:auto;padding:16px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:23px;margin:0}.sub,.small,.label{font-size:11px;color:var(--muted)}
.month{max-width:145px;border:1px solid var(--line);border-radius:15px;padding:8px;background:#fff;color:var(--ink)}
.mainTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#eee9e5;padding:5px;border-radius:18px;margin-bottom:12px}
.personTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#eee9e5;padding:5px;border-radius:18px;margin-bottom:12px}
.mainTabs button,.personTabs button{border:0;background:transparent;border-radius:14px;padding:11px 8px;font-weight:850;color:var(--muted)}
.mainTabs button.active,.personTabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(100,85,75,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(100,85,75,.06)}
.total{font-size:32px;font-weight:900;margin:3px 0 12px}
.peopleCards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.personCard{padding:11px;border-radius:18px;background:#f4e9e6}
.personCard:nth-child(even){background:#e9f0eb}
.personCard strong{display:block;font-size:17px;margin-top:3px}
.quickGrid{display:grid;grid-template-columns:1.3fr .8fr;gap:8px}
.quickRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;color:var(--ink)}
.primary{width:100%;border:0;border-radius:15px;padding:12px;background:var(--pink);color:var(--ink);font-weight:850;margin-top:8px}
.primary.sage{background:var(--sage)}.primary.danger{background:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action{border:0;border-radius:16px;padding:12px;background:var(--pink);font-weight:850;color:var(--ink);text-align:center}
.action:nth-child(2){background:var(--sage)}
input[type=file]{display:none}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tool{border:0;border-radius:13px;padding:8px 10px;background:#eee7e2;color:var(--ink);font-size:11px;font-weight:800}
.notice{margin-top:10px;padding:10px 11px;border-radius:14px;background:#f2ece7;font-size:10.5px;line-height:1.6;color:#817773}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.merchant{font-weight:800;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.amount{font-weight:900}.tag{display:inline-block;margin-left:3px;padding:3px 6px;border-radius:999px;background:#eee5df;font-size:9px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 2px}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:22px 7px}
.hidden{display:none!important}
.chartWrap{height:330px;margin-top:10px}.chartWrap canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.legendItem{font-size:10px;background:#f4efeb;border-radius:999px;padding:5px 8px}
.overlay{position:fixed;inset:0;background:rgba(50,43,40,.38);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.sheet{width:min(100%,520px);max-height:88vh;overflow:auto;background:var(--card);border-radius:26px;padding:18px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheetHead h2{font-size:18px;margin:0}
.close{border:0;background:#eee7e2;border-radius:50%;width:32px;height:32px}
.catline{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin-bottom:7px}
.memberLine{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:7px}
.mini{border:0;border-radius:11px;background:#f0e9e4;color:var(--ink);padding:9px 10px;font-size:10px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>家計簿 🫧</h1><div class="sub">やさしく、かんたんに記録</div></div>
  <input id="month" class="month" type="month">
</header>

<div class="mainTabs">
  <button id="homeBtn" class="active" onclick="showHome()">家計簿</button>
  <button id="graphBtn" onclick="showGraph()">グラフ</button>
</div>

<section id="homeView">
  <div class="personTabs">
    <button id="allBtn" class="active" onclick="setPerson('all')">全体</button>
    <button id="p1Btn" onclick="setPerson('p1')">👩🏻</button>
    <button id="p2Btn" onclick="setPerson('p2')">👨🏻</button>
  </div>

  <section class="card">
    <div class="label">今月の支出</div>
    <div id="total" class="total">¥0</div>
    <div id="peopleCards" class="peopleCards">
      <div class="personCard"><b>👩🏻</b><strong>¥0</strong></div>
      <div class="personCard"><b>👨🏻</b><strong>¥0</strong></div>
    </div>
  </section>

  <section class="card">
    <b>💴 支出を追加</b>
    <div class="quickGrid" style="margin-top:10px">
      <input id="cashName" class="field" placeholder="買ったもの / お店">
      <input id="cashAmount" class="field" type="number" inputmode="numeric" placeholder="金額">
    </div>
    <div class="quickRow">
      <select id="cashCat">
        <option>食費</option><option>外食</option><option>日用品</option><option>雑貨</option>
        <option>ベビー用品</option><option>美容</option><option>交際費</option><option>通信費</option>
        <option>娯楽</option><option>水道</option><option>ガス</option><option>電気</option><option>車</option>
      </select>
      <select id="cashPerson">
        <option value="p1">👩🏻</option><option value="p2">👨🏻</option>
      </select>
    </div>
    <button class="primary sage" onclick="addQuickExpense()">＋ 支出を追加</button>
  </section>

  <section class="card">
    <div class="actions">
      <label class="action">📥 PayPay CSV<input id="csv" type="file" accept=".csv,text/csv" onchange="importPayPay(this)"></label>
      <button class="action" onclick="openTransaction()">＋ 詳細入力</button>
    </div>
    <div class="toolbar">
      <button class="tool" onclick="openMembers()">👥 メンバー編集</button>
      <button class="tool" onclick="openCategories()">🏷️ カテゴリ編集</button>
      <button class="tool" onclick="backupData()">📤 バックアップ</button>
    </div>
    <div class="notice">上の「全体 / 👩🏻 / 👨🏻」でワンタップ切替。カテゴリは追加・名前変更・↑↓で並び替えできます。</div>
  </section>

  <section class="card"><b>カテゴリ別</b><div id="categorySummary"><div class="empty">まだ支出がありません</div></div></section>

  <section class="card">
    <div style="display:flex;justify-content:space-between"><b>明細</b><span id="count" class="small">0件</span></div>
    <div class="filters">
      <select id="catFilter" onchange="render()">
        <option value="">全カテゴリ</option>
      </select>
      <select id="personFilter" onchange="render()">
        <option value="">全員</option><option value="p1">👩🏻</option><option value="p2">👨🏻</option>
      </select>
    </div>
    <div id="transactions"><div class="empty">まだ明細がありません</div></div>
  </section>
</section>

<section id="graphView" class="hidden">
  <section class="card">
    <div style="display:flex;justify-content:space-between"><b>カテゴリ別グラフ</b><span id="graphTotal" class="small">合計 ¥0</span></div>
    <select id="graphPerson" style="margin-top:10px" onchange="drawGraph()">
      <option value="all">全体</option><option value="p1">👩🏻</option><option value="p2">👨🏻</option>
    </select>
    <div class="chartWrap"><canvas id="chart"></canvas></div>
    <div id="legend" class="legend"></div>
  </section>
</section>
</div>

<div id="modal" class="overlay hidden" onclick="overlayClose(event)">
  <div class="sheet">
    <div class="sheetHead">
      <h2 id="modalTitle">編集</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
var DEFAULT_CATS=["食費","外食","日用品","雑貨","ベビー用品","美容","交際費","通信費","娯楽","水道","ガス","電気","車"];
var DEFAULT_MEMBERS=[{id:"p1",name:"👩🏻"},{id:"p2",name:"👨🏻"}];
var tx=loadJSON("k10_tx",[]);
var cats=loadJSON("k10_cats",DEFAULT_CATS.slice());
var members=loadJSON("k10_members",DEFAULT_MEMBERS.slice());
var currentPerson="all";
var editingId=null;

function $(id){return document.getElementById(id)}
function loadJSON(key,fallback){
  try{
    var v=JSON.parse(localStorage.getItem(key));
    return v===null?fallback:v;
  }catch(e){return fallback}
}
function saveAll(){
  localStorage.setItem("k10_tx",JSON.stringify(tx));
  localStorage.setItem("k10_cats",JSON.stringify(cats));
  localStorage.setItem("k10_members",JSON.stringify(members));
}
function yen(n){return "¥"+Math.round(n||0).toLocaleString("ja-JP")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "id_"+Date.now()+"_"+Math.floor(Math.random()*1000000)}
function memberName(id){
  for(var i=0;i<members.length;i++){if(members[i].id===id)return members[i].name}
  return "?"
}
function currentMonthTx(){
  var m=$("month").value;
  return tx.filter(function(t){return (t.date||"").slice(0,7)===m});
}
function catOptions(selected){
  return cats.map(function(c){return '<option value="'+esc(c)+'"'+(c===selected?' selected':'')+'>'+esc(c)+'</option>'}).join("");
}

function refreshStaticSelectors(){
  var oldCash=$("cashCat").value;
  $("cashCat").innerHTML=catOptions(cats.indexOf(oldCash)>=0?oldCash:cats[0]);

  var oldFilter=$("catFilter").value;
  $("catFilter").innerHTML='<option value="">全カテゴリ</option>'+catOptions(cats.indexOf(oldFilter)>=0?oldFilter:"");

  var pOptions=members.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join("");
  var pFilter='<option value="">全員</option>'+pOptions;
  $("personFilter").innerHTML=pFilter;
  $("cashPerson").innerHTML=pOptions;
  $("graphPerson").innerHTML='<option value="all">全体</option>'+pOptions;
}

function setPerson(who){
  currentPerson=who;
  $("allBtn").classList.toggle("active",who==="all");
  $("p1Btn").classList.toggle("active",who==="p1");
  $("p2Btn").classList.toggle("active",who==="p2");
  render();
}

function render(){
  refreshStaticSelectors();
  var all=currentMonthTx();
  var arr=all.filter(function(t){return currentPerson==="all"||t.person===currentPerson});
  var cf=$("catFilter").value;
  var pf=$("personFilter").value;
  if(cf)arr=arr.filter(function(t){return t.cat===cf});
  if(pf)arr=arr.filter(function(t){return t.person===pf});

  $("total").textContent=yen(arr.reduce(function(s,t){return s+t.amount},0));

  $("peopleCards").innerHTML=members.map(function(m){
    var value=all.filter(function(t){return t.person===m.id}).reduce(function(s,t){return s+t.amount},0);
    return '<div class="personCard"><b>'+esc(m.name)+'</b><strong>'+yen(value)+'</strong></div>';
  }).join("");

  var sums={};
  arr.forEach(function(t){sums[t.cat]=(sums[t.cat]||0)+t.amount});
  var summary="";
  cats.forEach(function(c){if(sums[c])summary+='<div class="row"><span>'+esc(c)+'</span><b>'+yen(sums[c])+'</b></div>'});
  $("categorySummary").innerHTML=summary||'<div class="empty">まだ支出がありません</div>';

  $("count").textContent=arr.length+"件";
  var rows=arr.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")}).map(function(t){
    return '<div class="row" onclick="openTransaction(\''+t.id+'\')">'+
      '<div style="flex:1"><div class="merchant">'+esc(t.name)+' <span class="tag">'+esc(memberName(t.person))+'</span></div>'+
      '<div class="meta">'+esc(t.date)+' ・ '+esc(t.cat)+' ・ '+esc(t.method||"")+'</div></div>'+
      '<div class="amount">'+yen(t.amount)+' ›</div></div>';
  }).join("");
  $("transactions").innerHTML=rows||'<div class="empty">まだ明細がありません</div>';
}

function addQuickExpense(){
  var amount=Math.abs(Number($("cashAmount").value));
  if(!amount){alert("金額を入れてね");return}
  tx.push({
    id:uid(),
    name:$("cashName").value.trim()||"支出",
    amount:amount,
    cat:$("cashCat").value,
    person:$("cashPerson").value,
    date:new Date().toISOString().slice(0,10),
    method:"現金"
  });
  $("cashName").value="";
  $("cashAmount").value="";
  saveAll();
  render();
}

function openTransaction(id){
  editingId=id||null;
  var t=null;
  if(id){for(var i=0;i<tx.length;i++){if(tx[i].id===id){t=tx[i];break}}}
  var name=t?t.name:"";
  var amount=t?t.amount:"";
  var date=t?t.date:new Date().toISOString().slice(0,10);
  var person=t?t.person:(currentPerson==="p2"?"p2":"p1");
  var cat=t?t.cat:cats[0];
  var method=t?t.method:"現金";

  var memberOptions=members.map(function(m){
    return '<option value="'+m.id+'"'+(m.id===person?' selected':'')+'>'+esc(m.name)+'</option>';
  }).join("");

  var body=
    '<input id="mName" class="field" placeholder="買ったもの / お店" value="'+esc(name)+'">'+
    '<input id="mAmount" class="field" type="number" inputmode="numeric" placeholder="金額" value="'+amount+'">'+
    '<input id="mDate" class="field" type="date" value="'+date+'">'+
    '<select id="mPerson">'+memberOptions+'</select>'+
    '<select id="mCat">'+catOptions(cat)+'</select>'+
    '<select id="mMethod">'+
      '<option'+(method==="現金"?' selected':'')+'>現金</option>'+
      '<option'+(method==="PayPay"?' selected':'')+'>PayPay</option>'+
      '<option'+(method==="カード"?' selected':'')+'>カード</option>'+
      '<option'+(method==="その他"?' selected':'')+'>その他</option>'+
    '</select>'+
    '<button class="primary" onclick="saveTransaction()">保存する</button>'+
    (id?'<button class="primary danger" onclick="deleteTransaction()">削除する</button>':"");

  openModal(id?"明細を編集":"詳細入力",body);
}

function saveTransaction(){
  var name=$("mName").value.trim();
  var amount=Math.abs(Number($("mAmount").value));
  if(!name||!amount){alert("買ったものと金額を入れてね");return}
  var obj={
    name:name,
    amount:amount,
    date:$("mDate").value,
    person:$("mPerson").value,
    cat:$("mCat").value,
    method:$("mMethod").value
  };
  if(editingId){
    for(var i=0;i<tx.length;i++){if(tx[i].id===editingId){tx[i]=Object.assign(tx[i],obj);break}}
  }else{
    obj.id=uid();
    tx.push(obj);
  }
  saveAll();
  closeModal();
  render();
}

function deleteTransaction(){
  if(!editingId)return;
  if(confirm("この明細を削除する？")){
    tx=tx.filter(function(t){return t.id!==editingId});
    saveAll();closeModal();render();
  }
}

function openCategories(){
  var body='<div id="catRows"></div>'+
    '<input id="newCat" class="field" placeholder="新しいカテゴリ">'+
    '<button class="primary sage" onclick="addCategory()">＋ カテゴリ追加</button>';
  openModal("カテゴリ編集",body);
  drawCategoryRows();
}
function drawCategoryRows(){
  var html="";
  for(var i=0;i<cats.length;i++){
    html+='<div class="catline">'+
      '<input class="field" id="catName_'+i+'" value="'+esc(cats[i])+'" onchange="renameCategory('+i+')">'+
      '<button class="mini" onclick="moveCategory('+i+',-1)">↑</button>'+
      '<button class="mini" onclick="moveCategory('+i+',1)">↓</button>'+
      '<button class="mini" onclick="deleteCategory('+i+')">削除</button>'+
    '</div>';
  }
  $("catRows").innerHTML=html;
}
function addCategory(){
  var n=$("newCat").value.trim();
  if(!n)return;
  if(cats.indexOf(n)>=0){alert("同じカテゴリがあります");return}
  cats.push(n);
  $("newCat").value="";
  saveAll();drawCategoryRows();render();
}
function renameCategory(i){
  var n=$("catName_"+i).value.trim();
  if(!n)return;
  if(cats.indexOf(n)>=0&&cats[i]!==n){alert("同じカテゴリがあります");return}
  var old=cats[i];
  cats[i]=n;
  tx.forEach(function(t){if(t.cat===old)t.cat=n});
  saveAll();render();drawCategoryRows();
}
function moveCategory(i,d){
  var j=i+d;
  if(j<0||j>=cats.length)return;
  var tmp=cats[i];cats[i]=cats[j];cats[j]=tmp;
  saveAll();drawCategoryRows();render();
}
function deleteCategory(i){
  if(cats.length<=1){alert("カテゴリは1つ以上必要です");return}
  var old=cats[i];
  var fallback=cats[i===0?1:0];
  if(!confirm(old+"を削除して、その明細を"+fallback+"へ移す？"))return;
  cats.splice(i,1);
  tx.forEach(function(t){if(t.cat===old)t.cat=fallback});
  saveAll();drawCategoryRows();render();
}

function openMembers(){
  var body='<div id="memberRows"></div>'+
    '<input id="newMember" class="field" placeholder="例：👶🏻 そあ">'+
    '<button class="primary sage" onclick="addMember()">＋ メンバー追加</button>';
  openModal("メンバー編集",body);
  drawMemberRows();
}
function drawMemberRows(){
  var html="";
  for(var i=0;i<members.length;i++){
    html+='<div class="memberLine">'+
      '<input class="field" id="memberName_'+i+'" value="'+esc(members[i].name)+'" onchange="renameMember('+i+')">'+
      '<button class="mini" onclick="deleteMember('+i+')">削除</button>'+
    '</div>';
  }
  $("memberRows").innerHTML=html;
}
function addMember(){
  var n=$("newMember").value.trim();
  if(!n)return;
  members.push({id:"p_"+Date.now(),name:n});
  $("newMember").value="";
  saveAll();drawMemberRows();render();
}
function renameMember(i){
  var n=$("memberName_"+i).value.trim();
  if(!n)return;
  members[i].name=n;
  saveAll();render();drawMemberRows();
}
function deleteMember(i){
  if(members.length<=1){alert("メンバーは1人以上必要です");return}
  var p=members[i];
  var fallback=members[i===0?1:0];
  if(!confirm(p.name+"を削除して、その明細を"+fallback.name+"へ移す？"))return;
  tx.forEach(function(t){if(t.person===p.id)t.person=fallback.id});
  members.splice(i,1);
  if(currentPerson===p.id)currentPerson="all";
  saveAll();drawMemberRows();render();
}

function openModal(title,body){
  $("modalTitle").textContent=title;
  $("modalBody").innerHTML=body;
  $("modal").classList.remove("hidden");
}
function closeModal(){$("modal").classList.add("hidden")}
function overlayClose(e){if(e.target===$("modal"))closeModal()}

function showHome(){
  $("homeView").classList.remove("hidden");
  $("graphView").classList.add("hidden");
  $("homeBtn").classList.add("active");
  $("graphBtn").classList.remove("active");
}
function showGraph(){
  $("homeView").classList.add("hidden");
  $("graphView").classList.remove("hidden");
  $("homeBtn").classList.remove("active");
  $("graphBtn").classList.add("active");
  drawGraph();
}
function drawGraph(){
  var who=$("graphPerson").value||"all";
  var arr=currentMonthTx().filter(function(t){return who==="all"||t.person===who});
  var sums={};arr.forEach(function(t){sums[t.cat]=(sums[t.cat]||0)+t.amount});
  var entries=[];cats.forEach(function(c){if(sums[c])entries.push([c,sums[c]])});
  $("graphTotal").textContent="合計 "+yen(arr.reduce(function(s,t){return s+t.amount},0));

  var canvas=$("chart");
  var rect=canvas.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  var w=Math.max(300,rect.width),h=Math.max(280,rect.height);
  canvas.width=w*dpr;canvas.height=h*dpr;
  var ctx=canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(entries.length===0){
    ctx.fillStyle="#9b918d";ctx.font="13px -apple-system";ctx.textAlign="center";
    ctx.fillText("データなし",w/2,h/2);
    $("legend").innerHTML="";
    return;
  }
  var max=0;entries.forEach(function(e){if(e[1]>max)max=e[1]});
  var left=88,rowH=Math.min(38,(h-32)/entries.length);
  var colors=["#d7b9b5","#bdcbbb","#cbc1d1","#e1cdb6","#c2ceda","#d9c3c8","#c7d6ca","#d8cfbf","#c8c3d8","#e1d1c8","#c4d1cf","#d8c8ba","#c9d4b8"];
  entries.forEach(function(e,i){
    var y=16+i*rowH+rowH/2;
    var bw=(e[1]/max)*(w-left-20);
    ctx.font="11px -apple-system";ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle="#625b58";
    ctx.fillText(e[0],left-8,y);
    ctx.fillStyle=colors[i%colors.length];
    ctx.fillRect(left,y-8,bw,16);
  });
  $("legend").innerHTML=entries.map(function(e){return '<span class="legendItem">'+esc(e[0])+" "+yen(e[1])+'</span>'}).join("");
}

function parseCSV(text){
  var rows=[],row=[],field="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(c==='"'){
      if(q&&text[i+1]==='"'){field+='"';i++}else q=!q;
    }else if(c===','&&!q){
      row.push(field);field="";
    }else if((c==='\n'||c==='\r')&&!q){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(field);
      if(row.join("")!=="")rows.push(row);
      row=[];field="";
    }else{field+=c}
  }
  if(field||row.length){row.push(field);rows.push(row)}
  return rows;
}
function autoCategory(name){
  var rules=[["西松屋","ベビー用品"],["アカチャンホンポ","ベビー用品"],["ベルフ","食費"],["マイヤ","食費"],["マクドナルド","外食"],["サーティワン","外食"],["セリア","雑貨"],["ダイソー","雑貨"],["薬王堂","日用品"],["ツルハ","日用品"],["ウエルシア","日用品"],["JA-SS","車"],["JASSPORT","車"],["タイムズ","車"],["ソフトバンク","通信費"],["SHEIN","美容"],["GU","美容"],["しまむら","美容"],["POP MART","娯楽"]];
  for(var i=0;i<rules.length;i++){if(name.indexOf(rules[i][0])>=0&&cats.indexOf(rules[i][1])>=0)return rules[i][1]}
  return cats[0]||"食費";
}
async function importPayPay(input){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var rows=parseCSV((await file.text()).replace(/^\uFEFF/,""));
  if(rows.length<2){alert("CSVを読み込めませんでした");return}
  var h=rows[0];
  function idx(n){for(var i=0;i<h.length;i++){if(h[i].indexOf(n)>=0)return i}return -1}
  var di=idx("取引日"),oi=idx("出金金額"),si=idx("取引内容"),mi=idx("取引先"),meti=idx("取引方法"),ni=idx("取引番号");
  var owner=confirm("このCSVは👨🏻のPayPay？\nOK=👨🏻 / キャンセル=👩🏻")?"p2":"p1";
  var existing={};tx.forEach(function(t){if(t.txno)existing[t.txno]=1});
  var added=0;
  for(var r=1;r<rows.length;r++){
    var row=rows[r],desc=(row[si]||"").trim(),name=(row[mi]||"").trim(),txno=(row[ni]||"").trim();
    if(desc!=="支払い"||!txno||existing[txno])continue;
    var amount=Math.abs(Number((row[oi]||"").replace(/[^\d.-]/g,"")));
    if(!amount)continue;
    tx.push({id:uid(),txno:txno,name:name||"不明",amount:amount,date:(row[di]||"").slice(0,10).replace(/\//g,"-"),person:owner,cat:autoCategory(name),method:(row[meti]||"PayPay").trim()});
    existing[txno]=1;added++;
  }
  saveAll();render();alert(added+"件読み込んだよ！");
  input.value="";
}
function backupData(){
  var blob=new Blob([JSON.stringify({tx:tx,cats:cats,members:members},null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="家計簿バックアップ.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}
