<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7c4bf">
<title>家計簿</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">

<style>
:root{--bg:#f7f3ef;--card:#fffdfb;--ink:#5f5855;--muted:#9b918d;--line:#eee6e1;--pink:#eadbd8;--sage:#dce8df;--lav:#e5deea;--danger:#efd8d4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:auto;padding:16px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:23px;margin:0}.sub,.small,.label{font-size:11px;color:var(--muted)}
.month{max-width:145px;border:1px solid var(--line);border-radius:15px;padding:8px;background:#fff;color:var(--ink)}
.mainTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#eee9e5;padding:5px;border-radius:18px;margin-bottom:12px}
.personTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#eee9e5;padding:5px;border-radius:18px;margin-bottom:12px}
.mainTabs button,.personTabs button{border:0;background:transparent;border-radius:14px;padding:11px 8px;font-weight:850;color:var(--muted)}
.mainTabs button.active,.personTabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(100,85,75,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(100,85,75,.06)}
.total{font-size:32px;font-weight:900;margin:3px 0 12px}
.peopleCards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.personCard{padding:11px;border-radius:18px;background:#f4e9e6}
.personCard:nth-child(even){background:#e9f0eb}
.personCard strong{display:block;font-size:17px;margin-top:3px}
.quickGrid{display:grid;grid-template-columns:1.3fr .8fr;gap:8px}
.quickRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;color:var(--ink)}
.primary{width:100%;border:0;border-radius:15px;padding:12px;background:var(--pink);color:var(--ink);font-weight:850;margin-top:8px}
.primary.sage{background:var(--sage)}.primary.danger{background:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action{border:0;border-radius:16px;padding:12px;background:var(--pink);font-weight:850;color:var(--ink);text-align:center}
.action:nth-child(2){background:var(--sage)}
input[type=file]{display:none}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tool{border:0;border-radius:13px;padding:8px 10px;background:#eee7e2;color:var(--ink);font-size:11px;font-weight:800}
.notice{margin-top:10px;padding:10px 11px;border-radius:14px;background:#f2ece7;font-size:10.5px;line-height:1.6;color:#817773}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.merchant{font-weight:800;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.amount{font-weight:900}.tag{display:inline-block;margin-left:3px;padding:3px 6px;border-radius:999px;background:#eee5df;font-size:9px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 2px}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:22px 7px}
.hidden{display:none!important}
.chartWrap{height:330px;margin-top:10px}.chartWrap canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.legendItem{font-size:10px;background:#f4efeb;border-radius:999px;padding:5px 8px}
.graphCategoryBtn{border:0;background:#f4efeb;color:var(--ink);border-radius:999px;padding:8px 10px;font-size:11px;font-weight:750;display:inline-flex;align-items:center;gap:5px}
.graphCategoryBtn.active{outline:2px solid #cbbab4;background:#fff}
.graphDetails{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.graphDetailsTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(50,43,40,.38);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.sheet{width:min(100%,520px);max-height:88vh;overflow:auto;background:var(--card);border-radius:26px;padding:18px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheetHead h2{font-size:18px;margin:0}
.close{border:0;background:#eee7e2;border-radius:50%;width:32px;height:32px}
.catline{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin-bottom:7px}
.memberLine{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:7px}
.mini{border:0;border-radius:11px;background:#f0e9e4;color:var(--ink);padding:9px 10px;font-size:10px;font-weight:800}

.fixedBadge{display:inline-block;margin-left:4px;padding:3px 6px;border-radius:999px;background:#e8e0ee;font-size:9px}
.fixedItem{padding:11px 0;border-bottom:1px solid var(--line)}
.fixedItem:last-child{border-bottom:0}
.fixedTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fixedMeta{margin-top:4px;color:var(--muted);font-size:10px}

</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>家計簿 🫧</h1><div class="sub">やさしく、かんたんに記録</div></div>
  <input id="month" class="month" type="month">
</header>

<div class="mainTabs">
  <button id="homeBtn" class="active" onclick="showHome()">家計簿</button>
  <button id="graphBtn" onclick="showGraph()">グラフ</button>
</div>

<section id="homeView">
  <div class="personTabs">
    <button id="allBtn" class="active" onclick="setPerson('all')">全体</button>
    <button id="p1Btn" onclick="setPerson('p1')">👩🏻</button>
    <button id="p2Btn" onclick="setPerson('p2')">👨🏻</button>
  </div>

  <section class="card">
    <div class="label">今月の支出</div>
    <div id="total" class="total">¥0</div>
    <div id="peopleCards" class="peopleCards">
      <div class="personCard"><b>👩🏻</b><strong>¥0</strong></div>
      <div class="personCard"><b>👨🏻</b><strong>¥0</strong></div>
    </div>
  </section>

  <section class="card">
    <b>💴 支出を追加</b>
    <div class="quickGrid" style="margin-top:10px">
      <input id="cashName" class="field" placeholder="買ったもの / お店">
      <input id="cashAmount" class="field" type="number" inputmode="numeric" placeholder="金額">
    </div>
    <div class="quickRow">
      <select id="cashCat">
        <option>食費</option><option>外食</option><option>日用品</option><option>雑貨</option>
        <option>ベビー用品</option><option>美容</option><option>交際費</option><option>通信費</option>
        <option>娯楽</option><option>水道</option><option>ガス</option><option>電気</option><option>車</option>
      </select>
      <select id="cashPerson">
        <option value="p1">👩🏻</option><option value="p2">👨🏻</option>
      </select>
    </div>
    <button class="primary sage" onclick="addQuickExpense()">＋ 支出を追加</button>
  </section>

  <section class="card">
    <div style="margin-bottom:8px">
      <div class="label" style="margin-bottom:5px">PayPay CSVの持ち主</div>
      <select id="paypayOwner">
        <option value="p1">👩🏻</option>
        <option value="p2">👨🏻</option>
      </select>
    </div>
    <div class="actions">
      <label class="action">📥 PayPay CSVを読み込む<input id="csv" type="file" accept=".csv,text/csv" onchange="importPayPay(this)"></label>
      <button class="action" onclick="openTransaction()">＋ 詳細入力</button>
    </div>
    <div class="toolbar">
      <button class="tool" onclick="openFixedExpenses()">📌 固定支出</button>
      <button class="tool" onclick="openMembers()">👥 メンバー編集</button>
      <button class="tool" onclick="openCategories()">🏷️ カテゴリ編集</button>
      <button class="tool" onclick="backupData()">📤 バックアップ</button>
      <label class="tool">📥 復元<input id="restoreFile" type="file" accept=".json,application/json" onchange="restoreData(this)"></label>
    </div>
    <div class="notice">上の「全体 / 👩🏻 / 👨🏻」でワンタップ切替。カテゴリは追加・名前変更・↑↓で並び替えできます。PayPay CSVは選ぶだけで明細へ自動入力・自動分類。Safari→ホーム画面版への移行は「バックアップ」→「復元」でできます。</div>
  </section>

  <section class="card"><b>カテゴリ別</b><div id="categorySummary"><div class="empty">まだ支出がありません</div></div></section>

  <section class="card">
    <div style="display:flex;justify-content:space-between"><b>明細</b><span id="count" class="small">0件</span></div>
    <div class="filters">
      <select id="catFilter" onchange="render()">
        <option value="">全カテゴリ</option>
      </select>
      <select id="personFilter" onchange="render()">
        <option value="">全員</option><option value="p1">👩🏻</option><option value="p2">👨🏻</option>
      </select>
    </div>
    <div id="transactions"><div class="empty">まだ明細がありません</div></div>
  </section>
</section>

<section id="graphView" class="hidden">
  <section class="card">
    <div style="display:flex;justify-content:space-between"><b>カテゴリ別 円グラフ</b><span id="graphTotal" class="small">合計 ¥0</span></div>
    <select id="graphPerson" style="margin-top:10px" onchange="selectedGraphCategory=null;drawGraph()">
      <option value="all">全体</option><option value="p1">👩🏻</option><option value="p2">👨🏻</option>
    </select>
    <div class="chartWrap"><canvas id="chart"></canvas></div>
    <div id="legend" class="legend"></div>
    <div id="graphDetails" class="graphDetails hidden">
      <div class="graphDetailsTitle">
        <b id="graphDetailsTitle">カテゴリの支出</b>
        <span id="graphDetailsTotal" class="small"></span>
      </div>
      <div id="graphDetailsList"></div>
    </div>
  </section>
</section>
</div>

<div id="modal" class="overlay hidden" onclick="overlayClose(event)">
  <div class="sheet">
    <div class="sheetHead">
      <h2 id="modalTitle">編集</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
var DEFAULT_CATS=["食費","外食","日用品","雑貨","ベビー用品","美容","交際費","通信費","娯楽","水道","ガス","電気","車"];
var DEFAULT_MEMBERS=[{id:"p1",name:"👩🏻"},{id:"p2",name:"👨🏻"}];
var tx=loadJSON("k10_tx",[]);
var cats=loadJSON("k10_cats",DEFAULT_CATS.slice());
var members=loadJSON("k10_members",DEFAULT_MEMBERS.slice());
var merchantRules=loadJSON("k15_merchant_rules",{});
var fixedExpenses=loadJSON("k17_fixed_expenses",[]);
var currentPerson="all";
var editingId=null;
var editingFixedId=null;
var selectedGraphCategory=null;

function $(id){return document.getElementById(id)}
function loadJSON(key,fallback){
  try{
    var v=JSON.parse(localStorage.getItem(key));
    return v===null?fallback:v;
  }catch(e){return fallback}
}
function saveAll(){
  localStorage.setItem("k10_tx",JSON.stringify(tx));
  localStorage.setItem("k10_cats",JSON.stringify(cats));
  localStorage.setItem("k10_members",JSON.stringify(members));
  localStorage.setItem("k15_merchant_rules",JSON.stringify(merchantRules));
  localStorage.setItem("k17_fixed_expenses",JSON.stringify(fixedExpenses));
}
function yen(n){return "¥"+Math.round(n||0).toLocaleString("ja-JP")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "id_"+Date.now()+"_"+Math.floor(Math.random()*1000000)}
function memberName(id){
  for(var i=0;i<members.length;i++){if(members[i].id===id)return members[i].name}
  return "?"
}
function currentMonthTx(){
  var m=$("month").value;
  var normal=tx.filter(function(t){return (t.date||"").slice(0,7)===m});
  var parts=m.split("-");
  var year=Number(parts[0]), mon=Number(parts[1]);
  var lastDay=new Date(year,mon,0).getDate();
  var fixed=fixedExpenses.map(function(f){
    var day=Math.min(Math.max(Number(f.day)||1,1),lastDay);
    return {
      id:"fx_"+f.id+"_"+m,
      name:f.name,
      amount:Number(f.amount)||0,
      date:m+"-"+String(day).padStart(2,"0"),
      person:f.person,
      cat:f.cat,
      method:f.method||"口座引落",
      isFixed:true,
      sourceFixedId:f.id
    };
  });
  return normal.concat(fixed);
}
function catOptions(selected){
  return cats.map(function(c){return '<option value="'+esc(c)+'"'+(c===selected?' selected':'')+'>'+esc(c)+'</option>'}).join("");
}

function refreshStaticSelectors(){
  var oldCash=$("cashCat").value;
  $("cashCat").innerHTML=catOptions(cats.indexOf(oldCash)>=0?oldCash:cats[0]);

  var oldFilter=$("catFilter").value;
  $("catFilter").innerHTML='<option value="">全カテゴリ</option>'+catOptions(cats.indexOf(oldFilter)>=0?oldFilter:"");

  var pOptions=members.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join("");
  var pFilter='<option value="">全員</option>'+pOptions;
  $("personFilter").innerHTML=pFilter;
  $("cashPerson").innerHTML=pOptions;
  $("graphPerson").innerHTML='<option value="all">全体</option>'+pOptions;

  var paypayOwner=$("paypayOwner");
  if(paypayOwner){
    var oldOwner=paypayOwner.value;
    paypayOwner.innerHTML=pOptions;
    var ownerExists=false;
    for(var i=0;i<paypayOwner.options.length;i++){
      if(paypayOwner.options[i].value===oldOwner){ownerExists=true;break}
    }
    if(ownerExists)paypayOwner.value=oldOwner;
  }
}

function setPerson(who){
  currentPerson=who;
  $("allBtn").classList.toggle("active",who==="all");
  $("p1Btn").classList.toggle("active",who==="p1");
  $("p2Btn").classList.toggle("active",who==="p2");
  render();
}

function render(){
  refreshStaticSelectors();
  var all=currentMonthTx();
  var arr=all.filter(function(t){return currentPerson==="all"||t.person===currentPerson});
  var cf=$("catFilter").value;
  var pf=$("personFilter").value;
  if(cf)arr=arr.filter(function(t){return t.cat===cf});
  if(pf)arr=arr.filter(function(t){return t.person===pf});

  $("total").textContent=yen(arr.reduce(function(s,t){return s+t.amount},0));

  $("peopleCards").innerHTML=members.map(function(m){
    var value=all.filter(function(t){return t.person===m.id}).reduce(function(s,t){return s+t.amount},0);
    return '<div class="personCard"><b>'+esc(m.name)+'</b><strong>'+yen(value)+'</strong></div>';
  }).join("");

  var sums={};
  arr.forEach(function(t){sums[t.cat]=(sums[t.cat]||0)+t.amount});
  var summary="";
  cats.forEach(function(c){if(sums[c])summary+='<div class="row"><span>'+esc(c)+'</span><b>'+yen(sums[c])+'</b></div>'});
  $("categorySummary").innerHTML=summary||'<div class="empty">まだ支出がありません</div>';

  $("count").textContent=arr.length+"件";
  var rows=arr.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")}).map(function(t){
    var click=t.isFixed ? "openFixedExpense('"+t.sourceFixedId+"')" : "openTransaction('"+t.id+"')";
    return '<div class="row" onclick="'+click+'">'+
      '<div style="flex:1"><div class="merchant">'+esc(t.name)+' <span class="tag">'+esc(memberName(t.person))+'</span>'+(t.isFixed?'<span class="fixedBadge">固定</span>':'')+'</div>'+
      '<div class="meta">'+esc(t.date)+' ・ '+esc(t.cat)+' ・ '+esc(t.method||"")+'</div></div>'+
      '<div class="amount">'+yen(t.amount)+' ›</div></div>';
  }).join("");
  $("transactions").innerHTML=rows||'<div class="empty">まだ明細がありません</div>';
}

function addQuickExpense(){
  var amount=Math.abs(Number($("cashAmount").value));
  if(!amount){alert("金額を入れてね");return}
  tx.push({
    id:uid(),
    name:$("cashName").value.trim()||"支出",
    amount:amount,
    cat:$("cashCat").value,
    person:$("cashPerson").value,
    date:new Date().toISOString().slice(0,10),
    method:"現金"
  });
  $("cashName").value="";
  $("cashAmount").value="";
  saveAll();
  render();
}

function openTransaction(id){
  editingId=id||null;
  var t=null;
  if(id){for(var i=0;i<tx.length;i++){if(tx[i].id===id){t=tx[i];break}}}
  var name=t?t.name:"";
  var amount=t?t.amount:"";
  var date=t?t.date:new Date().toISOString().slice(0,10);
  var person=t?t.person:(currentPerson==="p2"?"p2":"p1");
  var cat=t?t.cat:cats[0];
  var method=t?t.method:"現金";

  var memberOptions=members.map(function(m){
    return '<option value="'+m.id+'"'+(m.id===person?' selected':'')+'>'+esc(m.name)+'</option>';
  }).join("");

  var body=
    '<input id="mName" class="field" placeholder="買ったもの / お店" value="'+esc(name)+'">'+
    '<input id="mAmount" class="field" type="number" inputmode="numeric" placeholder="金額" value="'+amount+'">'+
    '<input id="mDate" class="field" type="date" value="'+date+'">'+
    '<select id="mPerson">'+memberOptions+'</select>'+
    '<select id="mCat">'+catOptions(cat)+'</select>'+
    '<select id="mMethod">'+
      '<option'+(method==="現金"?' selected':'')+'>現金</option>'+
      '<option'+(method==="PayPay"?' selected':'')+'>PayPay</option>'+
      '<option'+(method==="カード"?' selected':'')+'>カード</option>'+
      '<option'+(method==="その他"?' selected':'')+'>その他</option>'+
    '</select>'+
    '<button class="primary" onclick="saveTransaction()">保存する</button>'+
    (id?'<button class="primary danger" onclick="deleteTransaction()">削除する</button>':"");

  openModal(id?"明細を編集":"詳細入力",body);
}

function saveTransaction(){
  var name=$("mName").value.trim();
  var amount=Math.abs(Number($("mAmount").value));
  if(!name||!amount){alert("買ったものと金額を入れてね");return}
  var obj={
    name:name,
    amount:amount,
    date:$("mDate").value,
    person:$("mPerson").value,
    cat:$("mCat").value,
    method:$("mMethod").value
  };
  if(editingId){
    for(var i=0;i<tx.length;i++){
      if(tx[i].id===editingId){
        tx[i]=Object.assign(tx[i],obj);
        break;
      }
    }
    merchantRules[name]=obj.cat;
  }else{
    obj.id=uid();
    tx.push(obj);
  }
  saveAll();
  closeModal();
  render();
}

function deleteTransaction(){
  if(!editingId)return;
  if(confirm("この明細を削除する？")){
    tx=tx.filter(function(t){return t.id!==editingId});
    saveAll();closeModal();render();
  }
}


function openFixedExpenses(){
  var body='<div id="fixedList"></div>'+
    '<button class="primary sage" onclick="openFixedExpense()">＋ 固定支出を追加</button>';
  openModal("固定支出",body);
  drawFixedList();
}

function drawFixedList(){
  if(!$("fixedList"))return;

  if(!fixedExpenses.length){
    $("fixedList").innerHTML='<div class="empty">まだ固定支出はありません</div>';
    return;
  }

  $("fixedList").innerHTML=fixedExpenses.map(function(f){
    return '<div class="fixedItem" data-fixed-id="'+esc(f.id)+'">'+
      '<div class="fixedTop"><b>'+esc(f.name)+'</b><strong>'+yen(f.amount)+' ›</strong></div>'+
      '<div class="fixedMeta">毎月 '+Number(f.day)+'日 ・ '+esc(f.cat)+' ・ '+esc(memberName(f.person))+'</div>'+
    '</div>';
  }).join("");

  var rows=$("fixedList").querySelectorAll(".fixedItem");
  for(var i=0;i<rows.length;i++){
    rows[i].onclick=function(){
      openFixedExpense(this.getAttribute("data-fixed-id"));
    };
  }
}

function openFixedExpense(id){
  editingFixedId=id||null;
  var f=null;

  if(editingFixedId){
    for(var i=0;i<fixedExpenses.length;i++){
      if(fixedExpenses[i].id===editingFixedId){
        f=fixedExpenses[i];
        break;
      }
    }
  }

  var person=f?f.person:(currentPerson==="all"?(members[0]?members[0].id:"p1"):currentPerson);
  var category=f?f.cat:(cats[0]||"食費");
  var method=f?f.method:"口座引落";

  var memberOptions=members.map(function(m){
    return '<option value="'+m.id+'"'+(m.id===person?' selected':'')+'>'+esc(m.name)+'</option>';
  }).join("");

  var body=
    '<input id="fName" class="field" placeholder="内容（例：住宅ローン）" value="'+esc(f?f.name:"")+'">'+
    '<input id="fAmount" class="field" type="number" inputmode="numeric" placeholder="金額" value="'+(f?f.amount:"")+'">'+
    '<input id="fDay" class="field" type="number" inputmode="numeric" min="1" max="31" placeholder="引き落とし日（1〜31）" value="'+(f?f.day:"")+'">'+
    '<select id="fPerson">'+memberOptions+'</select>'+
    '<select id="fCat">'+catOptions(category)+'</select>'+
    '<select id="fMethod">'+
      '<option'+(method==="口座引落"?' selected':'')+'>口座引落</option>'+
      '<option'+(method==="カード"?' selected':'')+'>カード</option>'+
      '<option'+(method==="その他"?' selected':'')+'>その他</option>'+
    '</select>'+
    '<button class="primary" onclick="saveFixedExpense()">保存する</button>'+
    (editingFixedId?'<button class="primary danger" onclick="deleteFixedExpense()">削除する</button>':'');

  openModal(editingFixedId?"固定支出を編集":"固定支出を追加",body);
}

function saveFixedExpense(){
  var name=$("fName").value.trim();
  var amount=Math.abs(Number($("fAmount").value));
  var day=Math.round(Number($("fDay").value));

  if(!name||!amount){
    alert("内容と金額を入れてね");
    return;
  }
  if(!day||day<1||day>31){
    alert("引き落とし日は1〜31で入れてね");
    return;
  }

  var obj={
    name:name,
    amount:amount,
    day:day,
    person:$("fPerson").value,
    cat:$("fCat").value,
    method:$("fMethod").value
  };

  if(editingFixedId){
    for(var i=0;i<fixedExpenses.length;i++){
      if(fixedExpenses[i].id===editingFixedId){
        fixedExpenses[i]=Object.assign(fixedExpenses[i],obj);
        break;
      }
    }
  }else{
    obj.id="fixed_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    fixedExpenses.push(obj);
  }

  saveAll();
  editingFixedId=null;
  closeModal();
  render();
  if(!$("graphView").classList.contains("hidden"))drawGraph();
}

function deleteFixedExpense(){
  if(!editingFixedId)return;
  if(!confirm("この固定支出を削除する？"))return;

  fixedExpenses=fixedExpenses.filter(function(f){return f.id!==editingFixedId});
  editingFixedId=null;
  saveAll();
  closeModal();
  render();
  if(!$("graphView").classList.contains("hidden"))drawGraph();
}

function openCategories(){
  var body='<div id="catRows"></div>'+
    '<input id="newCat" class="field" placeholder="新しいカテゴリ">'+
    '<button class="primary sage" onclick="addCategory()">＋ カテゴリ追加</button>';
  openModal("カテゴリ編集",body);
  drawCategoryRows();
}
function drawCategoryRows(){
  var html="";
  for(var i=0;i<cats.length;i++){
    html+='<div class="catline">'+
      '<input class="field" id="catName_'+i+'" value="'+esc(cats[i])+'" onchange="renameCategory('+i+')">'+
      '<button class="mini" onclick="moveCategory('+i+',-1)">↑</button>'+
      '<button class="mini" onclick="moveCategory('+i+',1)">↓</button>'+
      '<button class="mini" onclick="deleteCategory('+i+')">削除</button>'+
    '</div>';
  }
  $("catRows").innerHTML=html;
}
function addCategory(){
  var n=$("newCat").value.trim();
  if(!n)return;
  if(cats.indexOf(n)>=0){alert("同じカテゴリがあります");return}
  cats.push(n);
  $("newCat").value="";
  saveAll();drawCategoryRows();render();
}
function renameCategory(i){
  var n=$("catName_"+i).value.trim();
  if(!n)return;
  if(cats.indexOf(n)>=0&&cats[i]!==n){alert("同じカテゴリがあります");return}
  var old=cats[i];
  cats[i]=n;
  tx.forEach(function(t){if(t.cat===old)t.cat=n});
  saveAll();render();drawCategoryRows();
}
function moveCategory(i,d){
  var j=i+d;
  if(j<0||j>=cats.length)return;
  var tmp=cats[i];cats[i]=cats[j];cats[j]=tmp;
  saveAll();drawCategoryRows();render();
}
function deleteCategory(i){
  if(cats.length<=1){alert("カテゴリは1つ以上必要です");return}
  var old=cats[i];
  var fallback=cats[i===0?1:0];
  if(!confirm(old+"を削除して、その明細を"+fallback+"へ移す？"))return;
  cats.splice(i,1);
  tx.forEach(function(t){if(t.cat===old)t.cat=fallback});
  saveAll();drawCategoryRows();render();
}

function deleteMember(i){
  if(members.length<=1){alert("メンバーは1人以上必要です");return}

  if(!confirm(p.name+"を削除して、その明細を"+fallback.name+"へ移す？"))return;

function showGraph(){

  $("graphView").classList.remove("hidden");
  $("homeBtn").classList.remove("active");
  $("graphBtn").classList.add("active");
  drawGraph();

function drawGraph(){
  var who=$("graphPerson").value||"all";
  var arr=currentMonthTx().filter(function(t){return who==="all"||t.person===who});
  var sums={};
  arr.forEach(function(t){sums[t.cat]=(sums[t.cat]||0)+t.amount});

  var entries=[];
  cats.forEach(function(c){if(sums[c])entries.push([c,sums[c]])});

  var totalValue=arr.reduce(function(s,t){return s+t.amount},0);
  $("graphTotal").textContent="合計 "+yen(totalValue);

  if(selectedGraphCategory && !sums[selectedGraphCategory]){
    selectedGraphCategory=null;
  }

  var canvas=$("chart");
  var rect=canvas.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  var w=Math.max(300,rect.width),h=Math.max(300,rect.height);
  canvas.width=w*dpr;
  canvas.height=h*dpr;

  var ctx=canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  if(entries.length===0){
    ctx.fillStyle="#9b918d";
    ctx.font="13px -apple-system";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("データなし",w/2,h/2);
    $("legend").innerHTML="";
    $("graphDetails").classList.add("hidden");
    return;
  }

  var colors=[
    "#d7b9b5","#bdcbbb","#cbc1d1","#e1cdb6","#c2ceda",
    "#d9c3c8","#c7d6ca","#d8cfbf","#c8c3d8","#e1d1c8",
    "#c4d1cf","#d8c8ba","#c9d4b8"
  ];

  var cx=w/2;
  var cy=Math.min(h/2,155);
  var radius=Math.min(w*0.34,125);
  var start=-Math.PI/2;

  entries.forEach(function(e,i){
    var portion=e[1]/totalValue;
    var end=start+portion*Math.PI*2;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,end);
    ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];
    ctx.fill();

    if(selectedGraphCategory===e[0]){
      ctx.strokeStyle="#5f5855";
      ctx.lineWidth=3;
      ctx.stroke();
    }

    if(portion>=0.07){
      var mid=(start+end)/2;
      var lx=cx+Math.cos(mid)*radius*0.62;
      var ly=cy+Math.sin(mid)*radius*0.62;
      ctx.fillStyle="#5f5855";
      ctx.font="bold 11px -apple-system";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(Math.round(portion*100)+"%",lx,ly);
    }
    start=end;
  });

  $("legend").innerHTML=entries.map(function(e,i){
    var pct=totalValue?Math.round((e[1]/totalValue)*100):0;
    var active=selectedGraphCategory===e[0]?" active":"";
    return '<button type="button" class="graphCategoryBtn'+active+'" data-category="'+esc(e[0])+'">'+
      '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+colors[i%colors.length]+'"></span>'+
      esc(e[0])+" "+yen(e[1])+"（"+pct+"%）</button>";
  }).join("");

  var buttons=$("legend").querySelectorAll(".graphCategoryBtn");
  for(var b=0;b<buttons.length;b++){
    buttons[b].onclick=function(){
      var category=this.getAttribute("data-category");
      selectedGraphCategory=(selectedGraphCategory===category)?null:category;
      drawGraph();
    };
  }

  renderGraphDetails(arr);
}

function renderGraphDetails(arr){
  if(!selectedGraphCategory){
    $("graphDetails").classList.add("hidden");
    return;
  }

  var detail=arr.filter(function(t){return t.cat===selectedGraphCategory});
  detail.sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});

  $("graphDetails").classList.remove("hidden");
  $("graphDetailsTitle").textContent=selectedGraphCategory+" の支出";
  $("graphDetailsTotal").textContent=yen(detail.reduce(function(s,t){return s+t.amount},0))+"・"+detail.length+"件";

  $("graphDetailsList").innerHTML=detail.map(function(t){
    var click=t.isFixed ? "openFixedExpense('"+t.sourceFixedId+"')" : "openTransaction('"+t.id+"')";
    return '<div class="row" onclick="'+click+'">'+
      '<div style="min-width:0;flex:1">'+
        '<div class="merchant">'+esc(t.name)+' <span class="tag">'+esc(memberName(t.person))+'</span>'+(t.isFixed?'<span class="fixedBadge">固定</span>':'')+'</div>'+
        '<div class="meta">'+esc(t.date)+' ・ '+esc(t.method||"")+'</div>'+
      '</div>'+
      '<div class="amount">'+yen(t.amount)+' ›</div>'+
    '</div>';
  }).join("") || '<div class="empty">明細なし</div>';
}
function parseCSV(text){
  var rows=[],row=[],field="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(c==='"'){
      if(q&&text[i+1]==='"'){field+='"';i++}else q=!q;
    }else if(c===','&&!q){
      row.push(field);field="";
    }else if((c==='\n'||c==='\r')&&!q){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(field);
      if(row.join("")!=="")rows.push(row);
      row=[];field="";
    }else{
      field+=c;
    }
  }
  if(field||row.length){row.push(field);rows.push(row)}
  return rows;
}

async function readPayPayText(file){
  var buffer=await file.arrayBuffer();

  var utf8="";
  try{utf8=new TextDecoder("utf-8").decode(buffer)}catch(e){}
  if(utf8.indexOf("取引日")>=0 && utf8.indexOf("取引内容")>=0)return utf8;

  try{
    var sjis=new TextDecoder("shift_jis").decode(buffer);
    if(sjis.indexOf("取引日")>=0 && sjis.indexOf("取引内容")>=0)return sjis;
  }catch(e){}

  return utf8;
}

function normalizeMerchant(name){
  return String(name||"").replace(/\u3000/g," ").trim();
}

function autoCategory(name){
  name=normalizeMerchant(name);

  if(merchantRules[name] && cats.indexOf(merchantRules[name])>=0){
    return merchantRules[name];
  }

  var rules=[
    [["Coke ON","CokeON","COKE ON","コークオン"],"食費"],

    /* ベビー用品 */
    [["西松屋","アカチャンホンポ","赤ちゃん本舗","ベビーザらス","トイザらス"],"ベビー用品"],

    /* 外食 */
    [["マクドナルド","McDonald's","サーティワン","31アイス","シャトレーゼ","ミスタードーナツ","ミスド",
      "スターバックス","STARBUCKS","ドトール","モスバーガー","ケンタッキー","KFC","吉野家","すき家",
      "松屋","丸亀製麺","ガスト","サイゼリヤ","びっくりドンキー","コメダ","Uber Eats","出前館"],"外食"],

    /* 食費 */
    [["ベルフ","マイヤ","ユニバース","ジョイス","ビッグハウス","業務スーパー","生協","COOP","コープ",
      "イオン","AEON","イトーヨーカドー","ヨークベニマル","セブン-イレブン","セブンイレブン",
      "ローソン","ファミリーマート","ミニストップ","伊藤園"],"食費"],

    /* 日用品 */
    [["薬王堂","ツルハ","ウエルシア","ウェルシア","マツモトキヨシ","マツキヨ","サンドラッグ",
      "カワチ薬品","ココカラファイン"],"日用品"],

    /* 雑貨 */
    [["セリア","Seria","ダイソー","DAISO","キャンドゥ","Can Do","ワッツ","Watts","無印良品",
      "Amazon","Amazon.co.jp","Yahoo!ショッピング","Yahoo!フリマ","メルカリ","TikTok Shop"],"雑貨"],

    /* 美容 */
    [["SHEIN","GU","ジーユー","ユニクロ","UNIQLO","しまむら","tutuanna","チュチュアンナ",
      "アイブロウ","美容室","ヘアサロン","ネイル","まつげ","GANESHA","ZOZO"],"美容"],

    /* 通信費 */
    [["ソフトバンク","SoftBank","ドコモ","docomo","au","KDDI","楽天モバイル","Rakuten Mobile",
      "BIGLOBE","NTT","UQ mobile","ワイモバイル","Y!mobile"],"通信費"],

    /* 娯楽 */
    [["POP MART","ホビーゾーン","ちいかわ","ふるいち","Netflix","NETFLIX","Spotify",
      "Appleサービス","Apple Services","Nintendo","PlayStation","ゲームセンター","カラオケ","Uber One"],"娯楽"],

    /* 水道 */
    [["水道局","上下水道","水道料金"],"水道"],

    /* ガス */
    [["ガス料金","都市ガス","プロパン","LPガス"],"ガス"],

    /* 電気 */
    [["東北電力","東京電力","関西電力","電気料金","でんき"],"電気"],

    /* 車 */
    [["JA-SS","JASSPORT","ENEOS","エネオス","apollostation","出光","コスモ石油","タイムズ",

  ];

  if(cats.indexOf("雑貨")>=0)return "雑貨";
  return cats[0]||"食費";
}

async function importPayPay(input){
  if(!input.files||!input.files[0])return;

  var file=input.files[0];

  try{
    var text=await readPayPayText(file);
    text=text.replace(/^\uFEFF/,"");

    var rows=parseCSV(text);
    if(rows.length<2){
      alert("CSVの中身を読み込めませんでした");
      input.value="";
      return;
    }

    var h=rows[0].map(function(x){return String(x||"").trim()});

    function idxExactOrContains(name){
      var exact=h.indexOf(name);
      if(exact>=0)return exact;
      for(var i=0;i<h.length;i++){
        if(h[i].indexOf(name)>=0)return i;
      }
      return -1;
    }

    var di=idxExactOrContains("取引日");
    var oi=idxExactOrContains("出金金額");
    var si=idxExactOrContains("取引内容");
    var mi=idxExactOrContains("取引先");
    var meti=idxExactOrContains("取引方法");
    var ni=idxExactOrContains("取引番号");

    if(di<0||oi<0||si<0||mi<0||ni<0){
      alert("PayPay CSVの項目を確認できませんでした。\nPayPayから書き出したCSVをそのまま選んでね");
      input.value="";
      return;
    }

    var owner=$("paypayOwner") ? $("paypayOwner").value : "p1";

    var existing={};
    tx.forEach(function(t){
      if(t.txno)existing[String(t.txno)]=1;
    });

    var added=0,duplicates=0,ignored=0,invalid=0;
    var latestDate="";

    for(var r=1;r<rows.length;r++){
      var row=rows[r];
      var desc=String(row[si]||"").trim();
      var name=normalizeMerchant(row[mi]||"");
      var txno=String(row[ni]||"").trim();

      /* 支出として計上するのは PayPay の「支払い」だけ */
      if(desc!=="支払い"){
        ignored++;
        continue;
      }

      if(txno && existing[txno]){
        duplicates++;
        continue;
      }

      var amountText=String(row[oi]||"").replace(/[,\s円]/g,"").replace(/[^\d.-]/g,"");
      var amount=Math.abs(Number(amountText));

      if(!amount){
        invalid++;
        continue;
      }

      var rawDate=String(row[di]||"").trim();
      var date=rawDate.slice(0,10).replace(/\//g,"-");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
        invalid++;
        continue;
      }

      var category=autoCategory(name);

      tx.push({
        id:uid(),
        txno:txno || ("paypay_"+date+"_"+amount+"_"+name+"_"+r),
        name:name||"不明",
        amount:amount,
        date:date,
        person:owner,
        cat:category,
        method:String(row[meti]||"PayPay").trim()||"PayPay"
      });

      if(txno)existing[txno]=1;
      if(date>latestDate)latestDate=date;
      added++;
    }

    saveAll();

    /* 読み込んだ月へ自動で移動。これで「入ったのに見えない」を防ぐ */
    if(latestDate){
      $("month").value=latestDate.slice(0,7);
    }

    currentPerson="all";
    render();

    var ownerName=memberName(owner);
    alert(
      "PayPayを自動入力したよ！🫶\n\n"+
      "追加："+added+"件\n"+
      "持ち主："+ownerName+"\n"+
      "重複："+duplicates+"件\n"+
      "支払い以外を除外："+ignored+"件"+
      (invalid?("\n読み取れなかった行："+invalid+"件"):"")+
      "\n\nカテゴリもお店名から自動分類済み！"
    );
  }catch(e){
    alert("PayPay CSVの読み込み中にエラーが起きました");
  }

  input.value="";
}

function backupData(){
  var blob=new Blob([JSON.stringify({tx:tx,cats:cats,members:members,merchantRules:merchantRules,fixedExpenses:fixedExpenses},null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="家計簿バックアップ.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function restoreData(input){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var reader=new FileReader();

  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);

      if(!d || !Array.isArray(d.tx) || !Array.isArray(d.cats) || !Array.isArray(d.members)){
        alert("このファイルは家計簿のバックアップではないみたい");
        input.value="";
        return;
      }

      if(d.cats.length===0 || d.members.length===0){
        alert("バックアップの内容を確認できませんでした");
        input.value="";
        return;
      }

      if(!confirm("今この家計簿に入っているデータを、バックアップの内容に置き換える？")){
        input.value="";
        return;
      }

      tx=d.tx;
      cats=d.cats;
      members=d.members;
      merchantRules=d.merchantRules||{};
      fixedExpenses=d.fixedExpenses||[];
      currentPerson="all";
      saveAll();
      refreshStaticSelectors();
      render();

      if(!$("graphView").classList.contains("hidden"))drawGraph();

      alert("復元できたよ！🫶");
    }catch(e){
      alert("バックアップを読み込めませんでした");
    }
    input.value="";
  };

  reader.onerror=function(){
    alert("ファイルを読み込めませんでした");
    input.value="";
  };

  reader.readAsText(file);
}

$("month").value=new Date().toISOString().slice(0,7);
$("month").onchange=function(){selectedGraphCategory=null;render();if(!$("graphView").classList.contains("hidden"))drawGraph()};
refreshStaticSelectors();
render();
